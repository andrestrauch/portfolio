<section class="header">
  <div class="content-wrapper">
    <section class="logo">
      <a href="">
        <img src="assets/icon/logo2.png" alt="Logo" />
        <p class="white">A.Strauch</p>
        <p>developer</p>
      </a>
    </section>

    <section class="nav">
      <a href="#whyMeSection">
        <p>{{ 'header-whyMe' | translate }}</p>
      </a>
      <a href="#skillSection">
        <p>{{ 'header-skills' | translate }}</p>
      </a>
      <a href="#projectSection">
        <p>{{ 'header-projects' | translate }}</p>
      </a>

      <a href="#contactSection">
        <p>{{ 'header-contact' | translate }}</p>
      </a>
    </section>

    <section class="lang-btn">
      @if (lang() == 'de') {
        <button class="de-active"><p>DE</p></button>
      } @else {
        <button class="de" (click)="changeLanguage('de')"><p>DE</p></button>
      }

      @if (lang() == 'en') {
        <button class="en-active"><p>ENG</p></button>
      } @else {
        <button class="en" (click)="changeLanguage('en')"><p>ENG</p></button>
      }
    </section>
  </div>
</section>
